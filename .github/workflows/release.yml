name: Publish trainer release
on:
  push:
    paths:
      - 'downloads/release.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fetch_loader.py
      - run: python tools/verify_release.py
      - run: python -m pip install -r tests/requirements.txt
      - run: python tests/run.py
      - name: Publish verified ZIP on Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("downloads/release.json"))["version"])')
          ZIP=$(python -c 'import json; print(json.load(open("downloads/release.json"))["filename"])')
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "downloads/$ZIP" --clobber
          else
            gh release create "v$VERSION" "downloads/$ZIP" --target "$GITHUB_SHA" --title "Lost Budapest Trainer $VERSION" --notes-file release-notes.md
          fi
