name: Publish trainer release
on:
  push:
    paths:
      - 'tools/package.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fetch_loader.py
      - run: python -m pip install -r tests/requirements.txt
      - run: python tests/run.py
      - name: Build verified current ZIP from source
        run: python tools/package.py
      - name: Publish built ZIP on Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import re; print(re.search("VERSION = .([0-9.]+)", open("tools/package.py").read()).group(1))')
          ZIP="../LostBudapest-Noclip-$VERSION.zip"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$ZIP" --clobber
          else
            gh release create "v$VERSION" "$ZIP" --target "$GITHUB_SHA" --title "Lost Budapest Trainer $VERSION" --notes-file release-notes.md
          fi
