name: Trainer checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fetch_loader.py
      - run: python -m pip install -r tests/requirements.txt
      - run: python tests/run.py
      - name: Verify source identities and build current release
        run: python tools/package.py
